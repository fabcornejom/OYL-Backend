services:

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"          # 5433 en tu PC, para no chocar con tu PostgreSQL local
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  ms-productos:
    build: ./ms-productos
    ports:
      - "8081:8081"
    environment:
      OYL_SECURITY_PUBLIC_KEY: file:/run/secrets/oyl_jwt_public
      OYL_SECURITY_STOCK_TOKEN: file:/run/secrets/oyl_stock_service
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/oyl_productos
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    secrets:
      - oyl_jwt_public
      - oyl_stock_service
    depends_on:
      postgres:
        condition: service_healthy

  ms-usuarios:
    build: ./ms-usuarios
    ports:
      - "8083:8083"
    environment:
      OYL_SECURITY_PUBLIC_KEY: file:/run/secrets/oyl_jwt_public
      OYL_SECURITY_PRIVATE_KEY: file:/run/secrets/oyl_jwt_private
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/oyl_usuarios
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    secrets:
      - oyl_jwt_public
      - oyl_jwt_private
    depends_on:
      postgres:
        condition: service_healthy

  ms-pedidos:
    build: ./ms-pedidos
    ports:
      - "8082:8082"
    environment:
      OYL_SECURITY_PUBLIC_KEY: file:/run/secrets/oyl_jwt_public
      OYL_SECURITY_STOCK_TOKEN: file:/run/secrets/oyl_stock_service
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/oyl_pedidos
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      PRODUCTOS_URL: http://ms-productos:8081   # ← reemplaza productos.url
    secrets:
      - oyl_jwt_public
      - oyl_stock_service
    depends_on:
      postgres:
        condition: service_healthy
      ms-productos:
        condition: service_started

volumes:
  pgdata:
secrets:
  oyl_jwt_public:
    file: ./.oyl-secrets/jwt-public.pem
  oyl_jwt_private:
    file: ./.oyl-secrets/jwt-private.pem
  oyl_stock_service:
    file: ./.oyl-secrets/stock-service.token
