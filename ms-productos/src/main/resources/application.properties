spring.application.name=ms-productos

# Puerto propio de este microservicio
server.port=8081

# Conexión a PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/oyl_productos
spring.datasource.username=postgres
spring.datasource.password=Duoc2007

# Crea/actualiza las tablas automáticamente a partir de las clases Java
spring.jpa.hibernate.ddl-auto=update
# Muestra en consola el SQL que se ejecuta (útil para aprender)
spring.jpa.show-sql=true

# Incluir el mensaje del error en la respuesta JSON
server.error.include-message=always
server.error.include-binding-errors=always
# Migración aditiva e idempotente del registro de compras; no requiere vaciar la BD.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:idempotencia.sql
spring.sql.init.continue-on-error=false

# La tabla de fotos referencia productos: aplicar el SQL aditivo después de Hibernate.
spring.jpa.defer-datasource-initialization=true
# El archivo procesado admite hasta 2 MB; el resto corresponde a la ficha JSON.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
